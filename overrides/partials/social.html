{#- Material's partials/social.html with text links in place of icons, then the link to the guide home of this edition. -#}
<div class="md-social">
  {% for social in config.extra.social %}
    <a href="{{ social.link }}" target="_blank" rel="noopener" class="md-social__link">{{ social.name }}</a>
  {% endfor %}
  <a href="{{ config.extra.homepage | d(nav.homepage.url, true) | url }}" class="md-social__link">Build guide</a>
</div>
