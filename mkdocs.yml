site_name: Feeder 9mm case feeder
site_url: https://openreloading.github.io/Feeder/
site_description: Parametric brass collator for reloading. Build guide, BOM and assembly steps generated from feeder/config.py.
repo_url: https://github.com/OpenReloading/Feeder
repo_name: OpenReloading/Feeder
copyright: MIT licence
docs_dir: guide
exclude_docs: generated/steps.md   # snippet of index.md

theme:
  name: material
  custom_dir: overrides   # partials/source.html: header facts rendered at build time
  font: false   # system fonts: no requests to Google Fonts
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}

# header facts (latest tag, stars, forks): fetched from the GitHub API at build time, not in the browser
hooks:
  - hooks/repo_facts.py
  - hooks/table_layout.py   # <wbr> in inline code, data-label and data-stack on long tables
  - hooks/configurator_files.py   # build/configurator/ (build.py --configurator) into site/configurator/data/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/configurator.js

# build/guide/buildguide.json and guide/generated/ come from build.py --guide
plugins:
  - buildguide:
      data: build/guide/buildguide.json

markdown_extensions:
  - admonition
  - pymdownx.snippets:
      check_paths: true

nav:
  - Introduction: index.md
  - Configurator: configurator.md
  - BOM: bom.md
  - Assembly: assembly.md
  - Wiring: wiring.md
  - Tilt and capacity: tilt.md
  - Troubleshooting: troubleshooting.md
