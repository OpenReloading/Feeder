sonar.organization=openreloading
sonar.projectKey=OpenReloading_Feeder
# The packages pytest measures (coverage source in pyproject.toml); scripts and the guide outside them have no tests
sonar.sources=feeder,sim
sonar.tests=tests
sonar.python.version=3.14
# Written after the test run by `coverage xml -o coverage.xml --rcfile=/dev/null` (docs/development.md)
sonar.python.coverage.reportPaths=coverage.xml
# Not measured: CLI of the hours-long sweeps (omit in pyproject.toml)
sonar.coverage.exclusions=sim/__main__.py
