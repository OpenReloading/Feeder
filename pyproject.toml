[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "feeder-metric"
version = "0.2.0"
description = "Parametric brass and bullet collator for reloading, built in build123d"
license = "MIT"
requires-python = ">=3.11,<3.15"
# Exact pins; pylock.toml holds the full lock including transitive packages.
dependencies = [
  "build123d==0.13.0",
  "bd_warehouse==0.4.0",
  "trimesh==5.1.1",
  "shapely==2.2.0",
  "rtree==1.4.1",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "manifold3d==3.5.4",
  "networkx==3.7",
  "pandas==3.1.0",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0", "pytest-cov==7.1.0", "ocp_vscode==4.2.0"]
sim = ["mujoco==3.16.0", "coacd==1.0.14"]

[tool.setuptools.packages.find]
include = ["feeder*", "sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Measured by `pytest --cov` over the whole suite. Floors a little below the measured values (feeder 96, sim 94 percent,
# lines and branches together; sim 91 with a warm plate cache); raise them when coverage rises. The sim floor is in sim/.coveragerc.
[tool.coverage.run]
source = ["feeder", "sim"]
branch = true
# CLI front end of the sweeps, which run for hours; the logic is in sim/run.py and tested there
omit = ["sim/__main__.py"]

[tool.coverage.report]
include = ["feeder/*"]
fail_under = 94
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "B", "C4", "C90", "SIM", "RET", "PTH", "PERF", "RUF", "UP", "I", "PT", "ARG",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLE", "PLW", "PLC",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-returns = 6
max-branches = 12
max-statements = 50

# Relaxed per path: tests use fixtures and long setups; the part modules are long linear build123d scripts with
# many parameters, so size and complexity limits and unused-argument checks do not fit them.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "C901", "PLR0912", "PLR0913", "PLR0915", "PLC0415"]
"feeder/parts/**" = ["ARG", "C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.basedpyright]
# "standard" is the type checker of Pyright. "recommended" adds the Unknown* and missing-annotation reports.
typeCheckingMode = "standard"
# Folders and files to check; the baseline lives in .basedpyright/baseline.json.
include = ["feeder", "sim", "tests", "hooks", "build.py", "variants.py"]
