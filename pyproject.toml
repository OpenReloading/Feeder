[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "feeder-metric"
version = "0.1.0"
description = "Parametric brass and bullet collator for reloading, built in build123d"
license = "MIT"
requires-python = ">=3.11,<3.15"
# Exact pins; requirements.txt holds the full lock including transitive packages.
dependencies = [
  "build123d==0.13.0",
  "bd_warehouse==0.4.0",
  "trimesh==5.1.1",
  "shapely==2.2.0",
  "rtree==1.4.1",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "manifold3d==3.5.4",
  "networkx==3.7",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0", "ocp_vscode==4.2.0"]
sim = ["mujoco==3.16.0", "coacd==1.0.14"]

[tool.setuptools.packages.find]
include = ["feeder*", "sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
