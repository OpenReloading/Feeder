version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip:
        update-types: [minor, patch]
    ignore:  # held back by the locked environment: sympy needs mpmath < 1.4, dataclasses-json marshmallow < 4, bd-materials webcolors 24.8
      - dependency-name: mpmath
      - dependency-name: marshmallow
      - dependency-name: webcolors
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
