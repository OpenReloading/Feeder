name: Lint Python

# ruff and basedpyright (ESchuderer/repo-baseline). Rules: [tool.ruff] and [tool.basedpyright] in pyproject.toml.
# Existing findings are baselined: `# noqa` comments and .basedpyright/baseline.json.
on:
  pull_request:
  push:
    branches: [develop]

permissions: {}

jobs:
  lint-python:
    permissions:
      contents: read
    uses: ESchuderer/repo-baseline/.github/workflows/lint-python.yml@ffb474ae6c4b16adbdc70a603474df57937464f8 # main, after v0.1.0
    with:
      install-command: pip install -r requirements.txt
