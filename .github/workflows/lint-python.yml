name: Lint Python

# ruff and basedpyright, installed from requirements.txt (pins in pyproject.toml, so Dependabot bumps them).
# Rules: [tool.ruff] and [tool.basedpyright] in pyproject.toml.
# Existing findings are baselined: `# noqa` comments and .basedpyright/baseline.json.
on:
  pull_request:
  push:
    branches: [develop]

permissions: {}

jobs:
  lint-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: ruff
        run: ruff check .
      - name: basedpyright
        run: basedpyright
