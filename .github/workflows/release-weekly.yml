name: Release weekly
# Merges the release pull request on dispatch only (release-configurator.sh); there is no schedule.
on:
  workflow_dispatch:
permissions: {}
jobs:
  weekly:
    permissions:
      contents: read
      pull-requests: write
      actions: write
    uses: ESchuderer/repo-standards/.github/workflows/release-weekly.yml@64318e3c4acab490e348e21188c7ee8f3a85e1e7
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
