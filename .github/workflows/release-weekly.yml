name: Release weekly
# Merges the release pull request on dispatch only (release-configurator.sh); there is no schedule.
on:
  workflow_dispatch:
permissions: {}
jobs:
  weekly:
    permissions:
      contents: read
      pull-requests: write
      actions: write
    uses: eikelandin/repo-standards/.github/workflows/release-weekly.yml@c4192a7461a8894055d2e9615939ea2ac5dd6c71
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
