name: Release weekly
# Merges the release pull request on dispatch only (release-configurator.sh); there is no schedule.
on:
  workflow_dispatch:
permissions: {}
jobs:
  weekly:
    permissions:
      contents: read
      pull-requests: write
      actions: write
    uses: ESchuderer/repo-baseline/.github/workflows/release-weekly.yml@f3f4a70c28b09faabb0be86fb98be20390568e26
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
