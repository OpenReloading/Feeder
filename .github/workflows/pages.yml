name: Build guide
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages-${{ github.ref }}
  # a newer push or pull request commit cancels the older build, but a run on main (the deployment) is never cancelled
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# `build` is the check the ruleset requires. A push or dispatch on main also builds the configurator print files,
# `assemble` merges them into the site and `deploy` publishes it. A pull request and a merge group only build.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # a pull request that changes only docs runs the README test, not the geometry tests (HEAD^1 is the base)
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/.*|guide/[^/]*\.md|[^/]*\.md|mkdocs\.yml|LICENSE)$'; then
            echo "tests=tests" >> "$GITHUB_OUTPUT"
          else
            echo "tests=tests/test_guide.py" >> "$GITHUB_OUTPUT"
          fi
      # as .devcontainer: libgl for OCP, the locked environment, the package itself; DejaVu is the font of the lid text
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa fonts-dejavu-core
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r pylock.toml
          .venv/bin/pip install -r requirements-guide.txt
          .venv/bin/pip install --no-deps -e .
      # guide data in the background while the test files run on the runner's cores. The configurator's print files are
      # not built here: with the tests they need more CPU than one runner has in 30 minutes (job `configurator`)
      - env:
          TESTS: ${{ steps.scope.outputs.tests || 'tests' }}
        run: |
          .venv/bin/python build.py --no-test --guide > guide.log 2>&1 &
          guide=$!
          tests=0
          pytest_args=(-q -n auto --dist loadfile)
          # the coverage floors (pyproject.toml, sim/.coveragerc) need the whole suite, not the docs-only test file.
          # The bare --cov goes last: before the test path it would take that path as its source.
          if [ "$TESTS" = tests ]; then pytest_args+=(--cov); fi
          .venv/bin/python -m pytest "$TESTS" "${pytest_args[@]}" || tests=$?
          if [ "$TESTS" = tests ]; then .venv/bin/coverage report --rcfile=sim/.coveragerc || tests=$?; fi
          wait "$guide" || { cat guide.log; exit 1; }
          exit "$tests"
      # the header's repository facts come from the GitHub API at build time
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/mkdocs build --strict
      # the Pages artifact limit is 1 GB
      - run: |
          size=$(du -sm site | cut -f1)
          echo "site: $size MB"
          test "$size" -lt 800
      - if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 1
          if-no-files-found: error
  # The print files of the configurator page (about 44 CPU minutes, 32 minutes measured on a runner) on their own runner
  # beside `build`. Pull requests leave them out: their configurator page shows its notice.
  configurator:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa fonts-dejavu-core
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r pylock.toml
          .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/python build.py --no-test --configurator
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: configurator
          path: build/configurator
          retention-days: 1
          if-no-files-found: error
  assemble:
    if: github.ref == 'refs/heads/main'
    needs: [build, configurator]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: public
      # where hooks/configurator_files.py puts them in a local build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: configurator
          path: public/configurator/data
      # the Pages artifact limit is 1 GB
      - run: |
          size=$(du -sm public | cut -f1)
          echo "site: $size MB"
          test "$size" -lt 800
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: assemble
    # deployments of different runs queue instead of overlapping
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
