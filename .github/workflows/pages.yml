name: Build guide
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # as .devcontainer: libgl for OCP, the locked environment, the package itself
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-guide.txt
          .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python build.py --no-test --guide
      # the header's repository facts come from the GitHub API at build time
      - run: .venv/bin/mkdocs build --strict
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
