name: Build guide
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages-${{ github.ref }}
  # a newer pull request commit cancels the older build, but a run that deploys (main, a release) is never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# `build` is the check the ruleset requires. One deployment replaces the whole site, so a push, a release or a dispatch
# builds both editions: `main` goes to /next/ (`build`, without the configurator's print files, which its page announces
# as built on release) and the latest release, built from its tag, to the root (`stable-site`, `stable-configurator`).
# `assemble` merges them and `deploy` publishes. Until a release exists the root redirects to /next/. A pull request and
# a merge group only build.
jobs:
  latest:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(gh release list --repo "$REPO" --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # a release run starts on the tag and a dispatch can name one; this edition is main
          ref: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && 'main' || '' }}
          persist-credentials: false
          fetch-depth: 2
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # a pull request that changes only docs runs the README test, not the geometry tests (HEAD^1 is the base)
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/.*|guide/[^/]*\.md|[^/]*\.md|mkdocs\.yml|LICENSE)$'; then
            echo "tests=tests" >> "$GITHUB_OUTPUT"
          else
            echo "tests=tests/test_guide.py" >> "$GITHUB_OUTPUT"
          fi
      # as .devcontainer: libgl for OCP, the locked environment, the package itself; DejaVu is the font of the lid text
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa fonts-dejavu-core
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r pylock.toml
          .venv/bin/pip install -r requirements-guide.txt
          .venv/bin/pip install --no-deps -e .
      # guide data in the background while the test files run on the runner's cores
      - env:
          TESTS: ${{ steps.scope.outputs.tests || 'tests' }}
        run: |
          .venv/bin/python build.py --no-test --guide > guide.log 2>&1 &
          guide=$!
          tests=0
          pytest_args=(-q -n auto --dist loadfile)
          # the coverage floors (pyproject.toml, sim/.coveragerc) need the whole suite, not the docs-only test file.
          # The bare --cov goes last: before the test path it would take that path as its source.
          if [ "$TESTS" = tests ]; then pytest_args+=(--cov); fi
          .venv/bin/python -m pytest "$TESTS" "${pytest_args[@]}" || tests=$?
          if [ "$TESTS" = tests ]; then .venv/bin/coverage report --rcfile=sim/.coveragerc || tests=$?; fi
          wait "$guide" || { cat guide.log; exit 1; }
          exit "$tests"
      # the header's repository facts come from the GitHub API at build time
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/next/
        run: .venv/bin/mkdocs build --strict
      # the Pages artifact limit is 1 GB
      - run: |
          size=$(du -sm site | cut -f1)
          echo "site: $size MB"
          test "$size" -lt 800
      - if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 1
          if-no-files-found: error
  # The latest release, built from its own tag: the guide here, the configurator's print files (about 44 CPU minutes) on
  # the maintainer's machine with release-configurator.sh, which attaches them to the release as configurator-<tag>.tar.gz.
  # No release yet: both jobs are skipped.
  stable-site:
    needs: latest
    if: needs.latest.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.latest.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa fonts-dejavu-core
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r pylock.toml
          .venv/bin/pip install -r requirements-guide.txt
          .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/python build.py --no-test --guide
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/mkdocs build --strict
      - run: |
          size=$(du -sm site | cut -f1)
          echo "site: $size MB"
          test "$size" -lt 800
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-stable
          path: site
          retention-days: 1
          if-no-files-found: error
  stable-configurator:
    needs: latest
    if: needs.latest.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      found: ${{ steps.asset.outputs.found }}
      asset: ${{ steps.asset.outputs.id }}
    steps:
      # a release without the asset (the script has not run yet) leaves the page on its notice; the run after the
      # upload (gh workflow run pages.yml) publishes the files
      - id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.latest.outputs.tag }}
        run: |
          mkdir data
          id=$(gh release view "$TAG" --repo "$REPO" --json assets --jq ".assets[] | select(.name == \"configurator-$TAG.tar.gz\") | .id")
          if [ -n "$id" ]; then
            # an asset that cannot be downloaded or unpacked fails the job
            gh release download "$TAG" --repo "$REPO" --pattern "configurator-$TAG.tar.gz" --output - | tar -xz -C data
            test -f data/manifest.json
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::release $TAG has no configurator-$TAG.tar.gz; the configurator page shows its notice"
          fi
      - if: steps.asset.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: configurator-stable
          path: data
          retention-days: 1
          if-no-files-found: error
  assemble:
    needs: [latest, build, stable-site, stable-configurator]
    # the stable jobs are skipped while there is no release
    if: >-
      ${{ !cancelled() && needs.latest.result == 'success' && needs.build.result == 'success'
      && (needs.latest.outputs.tag == '' || (needs.stable-site.result == 'success' && needs.stable-configurator.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    # the configurator asset this assembly contains, for the freshness check of deploy
    outputs:
      asset: ${{ needs.stable-configurator.outputs.asset }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: public/next
      - if: needs.latest.outputs.tag != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-stable
          path: public
      - if: needs.stable-configurator.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: configurator-stable
          path: public/configurator/data
      - if: needs.latest.outputs.tag == ''
        run: echo '<!doctype html><meta http-equiv="refresh" content="0; url=next/">' > public/index.html
      # the Pages artifact limit is 1 GB
      - run: |
          size=$(du -sm public | cut -f1)
          echo "site: $size MB"
          test "$size" -lt 800
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
  deploy:
    needs: [latest, build, assemble]
    # deployments of different runs queue instead of overlapping
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # a run that is behind (a push, a release or the configurator upload came in while it built) leaves the deployment to the newer run, so an
      # older assembly never replaces a newer one
      - id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILT_MAIN: ${{ needs.build.outputs.sha }}
          BUILT_TAG: ${{ needs.latest.outputs.tag }}
          BUILT_ASSET: ${{ needs.assemble.outputs.asset }}
        run: |
          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          tag=$(gh release list --repo "$REPO" --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName')
          asset=
          if [ -n "$tag" ]; then
            asset=$(gh release view "$tag" --repo "$REPO" --json assets --jq ".assets[] | select(.name == \"configurator-$tag.tar.gz\") | .id")
          fi
          if [ "$main" = "$BUILT_MAIN" ] && [ "$tag" = "$BUILT_TAG" ] && [ "$asset" = "$BUILT_ASSET" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main, the latest release or its configurator asset changed during this run; the newer run deploys"
          fi
      - if: steps.fresh.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
