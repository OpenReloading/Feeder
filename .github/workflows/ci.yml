name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  workflows:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
  # ruff and basedpyright from the hash-locked requirements-dev.txt. Rules are in pyproject.toml, the basedpyright
  # baseline in .basedpyright/baseline.json, the ruff baseline as noqa comments.
  lint-python:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 3.14 is the interpreter of the dev container and of pylock.toml (wheels for one interpreter)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: '.venv/bin/pip install --only-binary :all: --require-hashes -r requirements-dev.txt'
      # basedpyright needs the project's dependencies to resolve imports
      - run: .venv/bin/pip install -r pylock.toml
      - run: .venv/bin/ruff check .
      - run: .venv/bin/basedpyright --pythonpath .venv/bin/python
  # compares a pull request with its base: only a pull request runs the step, the job still reports on merge_group
  dependency-review:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
